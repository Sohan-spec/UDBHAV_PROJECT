{% extends "master.html" %}
{% load static %}
{% block title %}Pants | UDBHAV{% endblock %}
{% block body_class %}page-leaf{% endblock %}

{% block content %}
<section class="cat-hero">
    <div class="container">
        <p class="crumb"><a href="/">Home</a> / <a href="/clothes/">Clothes</a> / Pants</p>
        <p class="eyebrow">Pants</p>
        <h1>Pants</h1>
        <p class="lead">Wardrobe foundations in honest denim.</p>
    </div>
</section>
<section class="section-tight" style="padding-top:0">
    <div class="container">
        <div class="product-grid">
            <article class="card">
                <div class="card-media"><img src="https://images.unsplash.com/photo-1542272604-787c3835535d?w=600&h=750&fit=crop" alt="Jeans" loading="lazy" onerror="this.onerror=null;this.src=UDBHAV.FALLBACK;"></div>
                <div class="card-info"><span class="card-cat">Bottom</span><span class="card-name">Jeans</span><span class="card-price">₹1,499</span></div>
            </article>
            <article class="card">
                <div class="card-media"><img src="https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=600&h=750&fit=crop" alt="Chinos" loading="lazy" onerror="this.onerror=null;this.src=UDBHAV.FALLBACK;"></div>
                <div class="card-info"><span class="card-cat">Bottom</span><span class="card-name">Chinos</span><span class="card-price">₹1,299</span></div>
            </article>
        </div>
    </div>
</section>
{% endblock %}
